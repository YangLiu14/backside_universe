<html lang="zh-CN">
<head>
<script type="module" src="../i18n/index.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="data:,">
  <script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/addons/"}}</script>
  <style>
    :root{color-scheme:light;font:16px/1.45 system-ui,sans-serif;color:#302d27;background:#eeeae2}*{box-sizing:border-box}
    body{margin:0}main{max-width:1180px;margin:auto;padding:clamp(16px,3vw,38px)}
    header,footer,nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header,footer{justify-content:space-between}
    header{border-bottom:1px solid #c7c1b6;padding-bottom:16px}h1{font-size:clamp(21px,3vw,34px);font-weight:560;letter-spacing:.05em;margin:0}
    a{color:inherit;text-underline-offset:4px}header a{font-size:14px}button,.download{border:1px solid #aaa197;background:transparent;border-radius:4px;padding:7px 15px;color:inherit;font:inherit;cursor:pointer;text-decoration:none}
    .download{background:#3a4236;color:#fff;border-color:#3a4236}button:hover{background:#e2dfd4}
    #stage{height:min(69vh,740px);min-height:310px;touch-action:none;position:relative;cursor:grab}#stage:active{cursor:grabbing}
    #stage canvas{display:block;width:100%;height:100%}#loading{position:absolute;inset:45% 0 auto;text-align:center;pointer-events:none}
    footer{border-top:1px solid #c7c1b6;padding-top:15px}footer p{margin:0;color:#626057;font-size:14px}
  </style>
<link rel="stylesheet" href="../cinema/premiere.css"></head>
<body class="review-film"><main>
<header><h1>小狗的坐姿模型 · Hi3D</h1><nav aria-label="模型版本与下载"><a href="./index.html">从原照进入 ↗</a><a id="alternate" href="?model=tripo">查看 Tripo 版</a><a class="download" href="./assets/dog/hi3d-dog.glb" download>下载 GLB</a></nav></header>
<div id="stage" tabindex="0" aria-label="可旋转的小狗模型，左右方向键旋转，上下方向键调整视角"><span id="loading" role="status">正在载入模型…</span></div>
<footer><nav aria-label="模型视角"><button type="button" data-pose="front">正面</button><button type="button" data-pose="right">右侧</button><button type="button" data-pose="back">背面</button></nav><p>拖动旋转 · 滚轮缩放</p></footer>
</main>
<script type="module">
  import {createViewer} from '../holiday-assets/model-viewer.js';
  const stage=document.querySelector('#stage'),loading=document.querySelector('#loading');
  const isTripo=new URLSearchParams(location.search).get('model')==='tripo';
  const download=document.querySelector('.download');
  if(isTripo){
    document.querySelector('h1').textContent='小狗的坐姿模型 · Tripo';
    const alternate=document.querySelector('#alternate');
    alternate.href='?model=hi3d';
    alternate.textContent='查看 Hi3D 版';
    download.href='./assets/dog/seated-dog.glb';
  }
  document.title=document.querySelector('h1').textContent;
  const poses={
    front:isTripo ? {angle:-.24,pitch:.21} : {angle:0,pitch:.43},
    right:{angle:Math.PI/2,pitch:.10},
    back:{angle:Math.PI,pitch:.16}
  };
  try{
    const viewer=createViewer(stage,{fitToViewport:true,shadows:true,groundShadow:true,exposure:isTripo ? .76 : .88});
    await viewer.load(download.href);
    viewer.setView(isTripo ? {angle:1.09,pitch:.12,distance:2.80} : {...poses.front,distance:2.80});
    document.querySelectorAll('[data-pose]').forEach(button=>button.addEventListener('click',()=>viewer.setView({...poses[button.dataset.pose],distance:2.80})));
    loading.hidden=true;
  }catch(error){loading.textContent='模型加载失败，可以下载 GLB 查看。';console.error(error);}
</script></body></html>
