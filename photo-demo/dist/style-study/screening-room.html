<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>放映风格选样 · 背面宇宙</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./screening.css">
  <script defer src="./work-data.js"></script>
  <script defer src="./screening.js"></script>
</head>
<body>
<main>
  <header class="mast">
    <h1>背面宇宙 <span>放映风格选样</span></h1>
    <a href="./index.html#cinema">返回原版 B</a>
  </header>
  <nav class="guide" aria-label="跳到变体">
    <a href="#premiere">B1　宽银幕首映</a>
    <a href="#cutting">B2　胶片剪辑台</a>
    <a href="#dual">B3　双机叠映</a>
  </nav>
  <section id="premiere" aria-labelledby="premiere-title">
    <header class="section-heading">
      <h2 id="premiere-title"><i>B1</i>宽银幕首映</h2>
      <p>按下放映，片名退场。镜头带你从日常照片走进微缩世界。</p>
    </header>
    <div class="pair"></div>
  </section>
  <section id="cutting" aria-labelledby="cutting-title">
    <header class="section-heading">
      <h2 id="cutting-title"><i>B2</i>胶片剪辑台</h2>
      <p>在整卷底片上挑一格放大看，再用方向键逐格浏览。</p>
    </header>
    <div class="pair"></div>
  </section>
  <section id="dual" aria-labelledby="dual-title">
    <header class="section-heading">
      <h2 id="dual-title"><i>B3</i>双机叠映</h2>
      <p>左机放原照，右机放背面。拖动分界线，看同一件东西如何变成另一个世界。</p>
    </header>
    <div class="pair"></div>
  </section>
</main>
</body>
</html>
