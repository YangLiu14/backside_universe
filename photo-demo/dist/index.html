<!doctype html>
<html lang="zh-CN">
<head>
<script type="module" src="./i18n/index.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#181512">
  <meta name="description" content="翻开放映相簿，走进日常照片背后的微缩世界。">
  <title>Backside Universe · 放映相簿</title>
  <link rel="icon" href="data:,">
  <script>const oldView = new URLSearchParams(location.search); if (['view','v','laptop'].some(key=>oldView.has(key))) location.replace('./legacy.html'+location.search+location.hash);</script>
  <link rel="stylesheet" href="./cinema/album.css">
  <script type="module" src="./cinema/album.js"></script>
</head>
<body>
  <main id="album">
    <header class="album-head">
      <span class="house">背面宇宙</span>
      <span class="edition" hidden>本册收录 <b></b> 部作品</span>
    </header>
    <section class="booth" aria-labelledby="album-title">
      <div class="booth-inner">
        <h1 id="album-title">放映相簿</h1>
        <p>翻过一张日常照片，走进它背面的小世界。</p>
      </div>
    </section>

    <div class="album-table">
      <div class="book-tools">
        <span class="book-heading">本册选映</span>
        <div class="preview-switch" role="group" aria-label="相片预览" hidden>
          <button type="button" data-preview="front" aria-pressed="true">原照片</button>
          <button type="button" data-preview="back" aria-pressed="false">背面剧照</button>
        </div>
      </div>
      <p id="catalog-status" role="status">正在打开相簿…</p>
      <button type="button" id="catalog-retry" hidden>重新加载</button>
      <div class="spread"></div>
      <template id="work-card">
        <a class="leaf" data-no-i18n>
          <div class="folio"><span></span><span class="theme"></span></div>
          <div class="montage">
            <figure class="print"><img width="800" height="800"><figcaption></figcaption></figure>
            <div class="filmstrip"></div>
          </div>
          <div class="legend">
            <h2></h2><p></p>
            <span class="entry"><span class="play" aria-hidden="true"></span><span class="entry-label"></span></span>
          </div>
        </a>
      </template>
    </div>
  </main>
  <div id="rooms"></div>
</body>
</html>
